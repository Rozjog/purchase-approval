{% if approval.status == "Одобрена" %}
    <span class="badge bg-success approval-status">
        {{ approval.status }}
    </span>
{% elif approval.status == "Отклонена" %}
    <span class="badge bg-danger approval-status">
        {{ approval.status }}
    </span>
{% else %}
    <span class="badge bg-secondary approval-status">
        {{ approval.status }}
    </span>
{% endif %}
